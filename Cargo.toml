[package]
name = "linux-wallpaper-engine"
version = "0.1.0"
edition = "2024"
description = "Yet another linux wallpaper engine"

[lib]
name = "linux_wallpaper_engine"
path = "src/lib.rs"

[workspace]
members = ["crates/lwe-cli", "crates/lwe-gui"]
default-members = [".", "crates/lwe-cli"]
# The Wallpaper Engine package parser is a git submodule that is used as a
# plain path dependency: it is not a member of this workspace.
exclude = ["src/pkg_parser"]

[dependencies]
# `ahash` with a fixed seed: the hash tables index assets, effects and shader
# symbols - they are not a security boundary, so the random (OS-sourced) seed
# `ahash` uses by default is not needed.  Dropping it also removes the
# `getrandom` dependency, which does not build for `wasm32-unknown-unknown`.
ahash = { version = "0.8.12", default-features = false, features = ["std", "no-rng"] }
bytemuck = "1.25.0"
log = "0.4"
pkg_parser = { path = "src/pkg_parser" }
glam = "0.31.0"
hashbrown = { version = "0.15.5", features = ["serde"] }
indicatif = "0.18.3"
pollster = "0.4.0"
raw-window-handle = "0.6.2"
rodio = { version = "0.21.1", default-features = false, features = [
  "lewton",
  "playback",
  "symphonia",
  "symphonia-mp3",
  "symphonia-aac",
  "symphonia-isomp4",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149" }
smithay-client-toolkit = "0.20.0"
wayland-client = "0.31.12"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wgpu = { version = "28.0.0", features = ["glsl"] }
winit = "0.30.12"
zbus = "5"

[dev-dependencies]
# The shader preprocessor is verified against the shader compiler wgpu uses:
# the tests preprocess a shader that Wallpaper Engine accepts but naga
# rejects and check that the preprocessed shader compiles and validates.
naga = { version = "28.0.0", features = ["glsl-in"] }

[profile.release]
opt-level = 3
debug = false
strip = true
lto = "fat"
panic = "abort"
codegen-units = 1
overflow-checks = false
